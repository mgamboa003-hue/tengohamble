<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tengo Hamble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tengo Hamble: carrito de completos, hamburguesas, sushi frito y frituras. Mira el menú y haz tu pedido para retiro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow phone column — carrito header, sticky category rail, stacked menu cards, floating order bar. Panel view reuses the same column. */
:root{
  --night:#0b0d17;        /* the street at night behind the carrito */
  --panel:#151827;        /* card surface */
  --panel-2:#1d2133;
  --line:#2a2f47;
  --ink:#f3f1ec;
  --muted:#9aa0bb;
  --red:#ff4433;          /* their sign lettering */
  --red-ink:#1a0806;
  --neon:#5b6cff;         /* the blue LEDs under the carrito */
  --ok:#2fcf7e; --warn:#ffb020;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --glass:rgb(255 255 255 / .055);--glass-2:rgb(255 255 255 / .09);--edge:rgb(255 255 255 / .10);--hi:rgb(255 255 255 / .14);
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.demo{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.demo b{color:var(--ink);font-weight:600}

.switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0}
.switch a{display:block;text-align:center;padding:9px 6px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.switch a[aria-current="page"]{background:var(--ink);color:var(--night)}
.switch .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}

/* hero — banner photo of the carrito, logo badge overlapping, name centered */
.top{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.banner{position:relative;height:190px;overflow:hidden;border-radius:0 0 22px 22px}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / .35),transparent 40%,rgb(11 13 23 / .55))}
.pills{position:absolute;z-index:2;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{background:#fff;color:#111;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;line-height:1.2;display:grid;gap:2px;box-shadow:0 4px 14px rgb(0 0 0 / .3)}
.pill .st{display:flex;align-items:center;gap:6px;font-size:15px}
.pill .st i{width:12px;height:12px;border-radius:50%;border:3px solid currentColor;box-sizing:border-box}
.pill .st.open{color:#118a4b}.pill .st.closed{color:#d8261a}
.pill small{font-weight:600;color:#555;font-size:12px}
.mine{border:0;background:var(--red);color:#fff;font-weight:800;border-radius:12px;padding:9px 14px;font-size:14px;box-shadow:0 4px 14px rgb(0 0 0 / .3)}
.mine[hidden]{display:none}
.badge-logo{position:relative;z-index:3;width:116px;height:116px;margin:-58px auto 0;border-radius:20px;background:#07080f;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--night),0 0 28px -2px var(--neon);display:grid;place-content:center;text-align:center}
.badge-logo svg{width:104px;height:104px;display:block}
.name{font-family:var(--display);text-align:center;font-size:clamp(28px,8.5vw,38px);margin:12px 0 2px;letter-spacing:.01em;font-weight:400;line-height:1;text-wrap:balance}
.sub{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin:0}
.sub svg{width:16px;height:16px;flex:none}
.info{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.info span{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}

.closedbox{margin:14px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--red) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 40%,transparent);font-size:14px}

/* sticky tabs, underline style */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px)) 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;margin-bottom:8px}
.sbtn svg{width:20px;height:20px}
.rail{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:none;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:16px;padding:10px 0 12px;border-bottom:3px solid transparent;white-space:nowrap}
.rail a.on{color:var(--red);border-bottom-color:var(--red)}
.search{margin-top:10px;position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

section.cat{scroll-margin-top:72px;padding-top:26px}
.cat h2{font-family:var(--display);font-size:26px;margin:0 0 2px;font-weight:400;line-height:1.1}
.cat .hint{color:var(--muted);font-size:13px;margin:0 0 6px}

/* destacados carousel */
.feat{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;margin:12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0 max(16px,env(safe-area-inset-left,0px))}
.feat::-webkit-scrollbar{display:none}
.fcard{flex:none;width:42%;min-width:150px;max-width:200px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left}
.fcard .ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--panel-2)}
.fcard img{width:100%;height:100%;object-fit:cover;display:block}
.fcard b{display:block;font-size:17px;font-weight:800;margin-top:8px}
.fcard span.n{display:block;font-size:14px;color:var(--ink);line-height:1.3}

/* product rows — text left, square photo right with + */
.rows{display:grid}
.row{display:grid;grid-template-columns:1fr 128px;gap:14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .txt{min-width:0;display:grid;gap:4px}
.row h3{margin:0;font-size:18px;font-weight:600;line-height:1.25}
.row p{margin:0;color:var(--muted);font-size:14px;line-height:1.35}
.row .pr{margin-top:6px;font-size:19px;font-weight:800}
.row .pr.tbd{font-size:14px;font-weight:600;color:var(--muted)}
.row .from{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
.thumb{position:relative;width:128px;height:128px;border-radius:14px;overflow:hidden;background:var(--panel-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.plus{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:400;line-height:1;box-shadow:0 4px 12px rgb(0 0 0 / .35)}
.fcard .plus{top:8px;bottom:auto}
.tag{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:var(--warn);color:#201400}
.tag.out{background:var(--red);color:#fff}
.row.soldout img,.row.tbd img{filter:grayscale(.9) brightness(.55)}
.row.soldout .plus,.row.tbd .plus{display:none}
.row[disabled]{cursor:default}

/* product sheet */
.pimg{margin:-18px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;aspect-ratio:4/3;max-width:none;overflow:hidden;border-radius:20px 20px 0 0;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .x{position:absolute;top:12px;right:12px;background:rgb(0 0 0 / .55);color:#fff}
.ptitle2{font-size:22px;font-weight:800;margin:0}
.pdesc{color:var(--muted);margin:4px 0 14px;font-size:14px}
.opt{margin:0 0 14px}
.opt h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.radio{display:grid;gap:6px}
.radio button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--night);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.radio button::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-right:10px;flex:none}
.radio button[aria-pressed="true"]{border-color:var(--red)}
.radio button[aria-pressed="true"]::before{border:6px solid var(--red)}
.radio button span:first-of-type{flex:1;text-align:left}
.addrow{display:flex;gap:10px;align-items:center;margin-top:6px}
.addrow .qty{grid-row:auto}
.addrow .cta{flex:1}
/* order bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--night) 30%)}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:14px;padding:14px 18px;background:var(--ink);color:var(--night);font-weight:700;font-size:16px;box-shadow:0 10px 30px -10px var(--neon)}
.bar .cnt{background:var(--red);color:#fff;border-radius:8px;padding:2px 8px;margin-right:8px;font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sheet h2{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:0;font-size:22px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:var(--panel-2);border-radius:10px;width:36px;height:36px;font-size:18px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{font-weight:600}.line .d{color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:8px;grid-row:span 2;align-self:center}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-weight:700}
.sum{display:grid;gap:4px;margin:12px 0;font-size:14px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:18px;font-weight:800;margin-top:4px}
.sum .promo{color:var(--warn)}
form{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta{border:0;background:var(--red);color:#fff;font-weight:800;font-size:16px;border-radius:14px;padding:15px}
.err{color:var(--red);font-size:13px;margin:0}

.done-box{text-align:center;padding:10px 0 4px}
.done-box .big{font-family:var(--display);font-size:46px;color:var(--red);line-height:1;margin:6px 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}
.steps div{font-size:11px;font-weight:600;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.steps div.on{color:var(--ink);border-color:var(--ok)}

/* panel */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:18px;font-weight:800}
.kpi span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 10px}
.ptitle h2{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:0;font-size:22px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 6px}
.toggle i{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--ok)}
.toggle[aria-pressed="true"] i::after{transform:translateX(14px)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.order{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.order.fresh{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.oh b{font-size:18px}
.oh .when{font-size:12px;color:var(--muted);text-align:right}
.order .meta{display:flex;flex-wrap:wrap;gap:6px}
.order .note{font-size:13px;background:var(--night);border-radius:8px;padding:6px 8px;color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button,.acts a{flex:1 1 140px;text-align:center;text-decoration:none;border-radius:10px;padding:10px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.acts .go{background:var(--ink);color:var(--night);border-color:var(--ink)}
.acts .wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:14px}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.stock{display:grid;gap:6px;margin-top:22px}
.stock h3{margin:0 0 4px;font-size:15px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.srow span{font-size:14px;font-weight:600}
.reset{margin-top:22px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:10px;font-size:13px}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.foot b{color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--night);font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px -10px #000}

/* ===== glass pass: frosted surfaces over the blurred carrito photo ===== */
.bgphoto{position:fixed;inset:-40px;z-index:-1;pointer-events:none}
.bgphoto img{width:100%;height:100%;object-fit:cover;filter:blur(38px) saturate(1.5) brightness(.32);transform:scale(1.1)}
.glass,.switch,.kpi,.order,.srow,.sheet,.tabs button,.radio button,.info span,.sbtn,.qty button,.reset,.empty{
  background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 1px 0 var(--hi)}
.sheet{background:rgb(16 18 30 / .78);border-color:var(--edge)}
.navbar{background:rgb(11 13 23 / .62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom-color:var(--edge)}
body::before{background:rgb(11 13 23 / .62)}
.switch a[aria-current="page"]{background:rgb(255 255 255 / .92)}
.tabs button[aria-pressed="true"]{background:rgb(255 255 255 / .92);border-color:transparent}
.radio button[aria-pressed="true"]{background:color-mix(in srgb,var(--red) 14%,transparent);border-color:color-mix(in srgb,var(--red) 70%,transparent)}
.row{border-bottom-color:var(--edge)}
.thumb,.fcard .ph{box-shadow:0 10px 30px -14px rgb(0 0 0 / .8),inset 0 0 0 1px var(--edge)}
.bar button{background:rgb(255 255 255 / .9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bar{background:none}

/* comanda: the order ticket */
.order{border-radius:20px;padding:0;gap:0;overflow:hidden;border-left:1px solid var(--edge)}
.order.s-nuevo{box-shadow:inset 0 1px 0 var(--hi),0 22px 40px -34px var(--red)}
.order.s-prep{box-shadow:inset 0 1px 0 var(--hi),0 22px 40px -34px var(--warn)}
.order.s-listo{box-shadow:inset 0 1px 0 var(--hi),0 22px 40px -34px var(--ok)}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px}
.c-num{font-family:var(--display);font-size:30px;line-height:.9;letter-spacing:.01em}
.c-who{font-weight:600;margin-top:6px;font-size:15px}
.c-st{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--glass-2);white-space:nowrap}
.c-st i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px 1px var(--c)}
.s-nuevo{--c:var(--red)}.s-prep{--c:var(--warn)}.s-listo{--c:var(--ok)}.s-entregado{--c:var(--muted)}
.c-when{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.c-pick{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px;background:rgb(255 255 255 / .035);font-size:13px;color:var(--muted)}
.c-pick b{color:var(--ink);font-size:16px}
.perf{height:14px;position:relative}
.perf::before{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:2px dashed var(--edge)}
.c-lines{list-style:none;margin:0;padding:6px 16px 0;font-family:var(--mono);font-size:13.5px;display:grid;gap:6px}
.c-lines li{display:grid;grid-template-columns:2.2em 1fr auto;gap:6px;align-items:baseline}
.c-lines .q{color:var(--c);font-weight:600}
.c-lines .det{display:block;color:var(--muted);font-size:12px}
.c-lines .pr{font-variant-numeric:tabular-nums}
.c-lines .promo{color:var(--warn)}
.c-note{margin:10px 16px 0;font-size:13px;color:var(--warn);font-family:var(--mono);padding-left:10px;border-left:2px solid var(--warn)}
.c-tot{display:flex;justify-content:space-between;align-items:baseline;padding:4px 16px 12px}
.c-tot span{color:var(--muted);font-size:13px}

function observe(){if(!("IntersectionObserver" in window))return;if(io)io.disconnect();io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const id=en.target.id.slice(2);document.querySelectorAll(".rail a").forEach(a=>{const on=a.dataset.cat===id;a.classList.toggle("on",on);if(on)a.scrollIntoView({block:"nearest",inline:"nearest"})})}})},{rootMargin:"-30% 0px -65% 0px"});document.querySelectorAll("section.cat").forEach(s=>io.observe(s))}let panelTab="activos";let freshN=null;

/* ---------- menu ---------- */
function unitPrice(it,choice){if(it.opts){let p=0;it.opts.forEach(o=>{const c=o.choices.find(c=>c.v===choice[o.k]);if(c&&c.p)p=c.p});return p}return it.price}
function renderStatus(){
  document.getElementById("status").innerHTML=S.open
   ?'<span class="st open"><i></i>Abierto</span><small>Pedidos para retiro</small>'
   :'<span class="st closed"><i></i>Cerrado</span><small>Puedes mirar el menú</small>';
  document.getElementById("closedMsg").innerHTML=S.open?"":'<div class="closedbox">El carrito está cerrado. Los pedidos se abren cuando prendan la plancha.</div>';
}
const FEAT=["completo","h-bacon","s-palta","tutitos"];
function fromPrice(it){if(it.opts){const ps=it.opts.flatMap(o=>o.choices.map(c=>c.p)).filter(Boolean);return Math.min(...ps)}return it.price}
function renderMenu(){
  renderStatus();
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  const cats=[];
  if(!q)cats.push({id:"destacados",name:"Destacados",feat:true});
  MENU.forEach(c=>{const items=c.items.filter(i=>!q||(i.name+" "+i.desc+" "+c.name).toLowerCase().includes(q));if(items.length)cats.push({...c,items})});
  document.getElementById("rail").innerHTML=cats.map((c,i)=>`<a href="#menu" data-cat="${c.id}" class="${i?"":"on"}">${c.name}</a>`).join("");
  document.getElementById("cats").innerHTML=cats.length?cats.map(c=>c.feat
    ?`<section class="cat" id="c-destacados"><h2>Destacados</h2><div class="feat">${FEAT.map(id=>{const it=ITEMS[id];return `<button class="fcard" data-open="${id}"><div class="ph"><img loading="lazy" src="${IMG[it.img]}" alt="">${S.soldout[id]?"":'<span class="plus" aria-hidden="true">+</span>'}</div><b class="num">${it.opts?'<span style="font-size:12px;color:var(--muted);font-weight:600">desde </span>':""}${clp(fromPrice(it))}</b><span class="n">${it.name}</span></button>`}).join("")}</div></section>`
    :`<section class="cat" id="c-${c.id}"><h2>${c.name}</h2>${c.hint?`<p class="hint">${c.hint}</p>`:""}<div class="rows">${c.items.map(rowHTML).join("")}</div></section>`).join("")
    :'<p class="empty" style="margin-top:20px">No encontramos eso en el menú.</p>';
  observe();
}
function rowHTML(it){
  const out=!!S.soldout[it.id],p=fromPrice(it),tbd=p==null;
  const tag=out?'<span class="tag out">Agotado</span>':it.tag?`<span class="tag">${it.tag}</span>`:"";
  return `<button class="row${out?" soldout":""}${tbd?" tbd":""}" ${out||tbd?"disabled":`data-open="${it.id}"`} id="i-${it.id}"><span class="txt"><h3>${it.name}</h3><p>${it.desc}</p><span class="pr num${tbd?" tbd":""}">${tbd?"Precio por confirmar":(it.opts?'<span class="from">desde</span>':"")+clp(p)}</span></span><span class="thumb"><img loading="lazy" src="${IMG[it.img]}" alt="">${tag}<span class="plus" aria-hidden="true">+</span></span></button>`;
}
let pq=1;
function openProduct(id){
  const it=ITEMS[id];if(S.soldout[id])return;
  sel[id]=sel[id]||{};(it.opts||[]).forEach(o=>{if(!sel[id][o.k])sel[id][o.k]=o.choices[0].v});pq=1;
  drawProduct(it);
}
function drawProduct(it){
  const p=unitPrice(it,sel[it.id]);
  openSheet(`<div class="pimg"><img src="${IMG[it.img]}" alt="${it.name}"><button class="x" aria-label="Cerrar" data-close>×</button></div>
  <p class="ptitle2" id="sheetTitle">${it.name}</p><p class="pdesc">${it.desc}${it.sushi?" · Promo 3 rolls por $6.000, se aplica sola al pedido.":""}</p>
  ${(it.opts||[]).map(o=>`<div class="opt"><h4>${o.label}</h4><div class="radio">${o.choices.map(c=>`<button data-k="${o.k}" data-v="${c.v}" aria-pressed="${sel[it.id][o.k]===c.v}"><span>${c.v}</span>${c.p?`<span class="num">${clp(c.p)}</span>`:""}</button>`).join("")}</div></div>`).join("")}
  <div class="addrow"><div class="qty"><button aria-label="Uno menos" data-pq="-1">−</button><b class="num">${pq}</b><button aria-label="Uno más" data-pq="1">+</button></div>
  <button class="cta num" id="addBtn" ${S.open?"":"disabled"}>${S.open?`Agregar · ${clp(p*pq)}`:"Carrito cerrado"}</button></div>`);
  sheet.querySelector("[data-close]").onclick=closeSheet;
  sheet.querySelectorAll(".radio button").forEach(b=>b.onclick=()=>{sel[it.id][b.dataset.k]=b.dataset.v;drawProduct(it)});
  sheet.querySelectorAll("[data-pq]").forEach(b=>b.onclick=()=>{pq=Math.max(1,pq+ +b.dataset.pq);drawProduct(it)});
  sheet.querySelector("#addBtn").onclick=()=>{for(let i=0;i<pq;i++)addToCart(it.id);closeSheet();toast(`${pq} × ${it.name} al pedido`)};
}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){openProduct(o.dataset.open);return}
  const r=e.target.closest(".rail a");
  if(r){e.preventDefault();const el=document.getElementById("c-"+r.dataset.cat);window.scrollTo({top:el.getBoundingClientRect().top+scrollY-64,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});return}
});
document.getElementById("sbtn").onclick=()=>{const b=document.getElementById("searchBox");b.hidden=!b.hidden;if(!b.hidden)document.getElementById("q").focus();else{document.getElementById("q").value="";renderMenu()}};
document.getElementById("q").addEventListener("input",renderMenu);
document.getElementById("mine").onclick=()=>showCart();
function addToCart(id){
  const it=ITEMS[id];const ch={...sel[id]};
  const det=it.opts?it.opts.map(o=>ch[o.k]).join(" · "):"";
  const key=id+"|"+det;const ex=S.cart.find(l=>l.key===key);
  if(ex)ex.q++;else S.cart.push({key,id,label:it.name,det,q:1,u:unitPrice(it,ch)});
  save();renderBar();
}
function totals(lines){
  const sub=lines.reduce((s,l)=>s+l.q*l.u,0);
  const rolls=lines.filter(l=>ITEMS[l.id]&&ITEMS[l.id].sushi).reduce((s,l)=>s+l.q,0);
  const promo=Math.floor(rolls/3)*(3*2500-6000);
  return{sub,promo,total:sub-promo,count:lines.reduce((s,l)=>s+l.q,0)};
}
function renderBar(){
  const t=totals(S.cart);const bar=document.getElementById("bar");
  bar.hidden=!t.count||route()!=="menu";
  document.getElementById("barCount").textContent=t.count;
  document.getElementById("barTotal").textContent=clp(t.total);
  document.getElementById("mine").hidden=!t.count;
}

/* ---------- cart sheet ---------- */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
function openSheet(html){sheet.innerHTML=html;scrim.hidden=false;document.body.style.overflow="hidden"}
function closeSheet(){scrim.hidden=true;document.body.style.overflow="";renderBar()}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!scrim.hidden)closeSheet()});
document.getElementById("openCart").onclick=showCart;
function slots(){
  const out=["Lo antes posible"];const d=new Date();d.setMinutes(Math.ceil((d.getMinutes()+20)/15)*15,0,0);
  for(let i=0;i<8;i++){out.push(d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}));d.setMinutes(d.getMinutes()+15)}
  return out;
}
function showCart(){
  const t=totals(S.cart);
  if(!t.count){closeSheet();return}
  openSheet(`<div class="sheet-h"><h2 id="sheetTitle">Tu pedido</h2><button class="x" aria-label="Cerrar" data-close>×</button></div>
  ${S.cart.map((l,i)=>`<div class="line"><span class="n">${l.label}</span><div class="qty"><button aria-label="Quitar uno" data-q="${i}" data-d="-1">−</button><b class="num">${l.q}</b><button aria-label="Agregar uno" data-q="${i}" data-d="1">+</button></div><span class="d">${l.det?l.det+" · ":""}<span class="num">${clp(l.u)}</span> c/u</span></div>`).join("")}
  <div class="sum num"><div><span>Subtotal</span><span>${clp(t.sub)}</span></div>${t.promo?`<div class="promo"><span>Promo sushi 3 x $6.000</span><span>−${clp(t.promo)}</span></div>`:""}<div class="tot"><span>Total</span><span>${clp(t.total)}</span></div></div>
  <form id="checkout" novalidate>
    <div class="two"><label>Nombre<input id="f-name" autocomplete="given-name" placeholder="Ej: Camila"></label>
    <label>Teléfono<input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+56 9 ..."></label></div>
    <div class="two"><label>Retiro<select id="f-pickup">${slots().map(s=>`<option>${s}</option>`).join("")}</select></label>
    <label>Pago<select id="f-pay"><option>Efectivo</option><option>Transferencia</option><option>Débito en el carrito</option></select></label></div>
    <label>Indicaciones (opcional)<textarea id="f-note" placeholder="Ej: italiano sin mayo"></textarea></label>
    <p class="err" id="f-err" hidden></p>
    <button class="cta num" type="submit">Enviar pedido · ${clp(t.total)}</button>
  </form>`);
  sheet.querySelector("[data-close]").onclick=closeSheet;
  sheet.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const l=S.cart[b.dataset.q];l.q+=+b.dataset.d;if(l.q<=0)S.cart.splice(b.dataset.q,1);save();renderBar();showCart()});
  sheet.querySelector("#checkout").addEventListener("submit",submitOrder);
}
function submitOrder(e){
  e.preventDefault();
  const name=document.getElementById("f-name").value.trim(),phone=document.getElementById("f-phone").value.trim();
  const err=document.getElementById("f-err");
  if(!name||phone.replace(/\D/g,"").length<8){err.textContent="Escribe tu nombre y un teléfono para avisarte cuando esté listo.";err.hidden=false;return}
  const t=totals(S.cart);
  const o={n:++S.seq,name,phone,pickup:document.getElementById("f-pickup").value,pay:document.getElementById("f-pay").value,note:document.getElementById("f-note").value.trim(),t:Date.now(),st:"nuevo",lines:S.cart.map(({key,...l})=>l),promo:t.promo,total:t.total};
  S.orders.push(o);S.cart=[];S.last=o.n;freshN=o.n;save();renderBar();beep();showDone(o);updateBadge();
}
function showDone(o){
  const order=["nuevo","prep","listo","entregado"],idx=order.indexOf(o.st);
  openSheet(`<div class="done-box"><p style="margin:0;color:var(--muted)">Pedido recibido</p><div class="big num">#${o.n}</div><p style="margin:0">Gracias, ${o.name}. Retiro: <b>${o.pickup}</b></p>
  <div class="steps">${["Recibido","Preparando","Listo","Entregado"].map((s,i)=>`<div class="${i<=idx?"on":""}">${s}</div>`).join("")}</div>
  <p style="color:var(--muted);font-size:13px;margin:0 0 14px">Te avisamos por WhatsApp cuando esté listo.</p>
  <button class="cta" style="width:100%" data-close>Seguir mirando el menú</button>
  <p style="font-size:13px;margin:12px 0 0"><a href="#panel" style="color:var(--neon);font-weight:600">Ver cómo le llega al carrito →</a></p></div>`);
  sheet.querySelector("[data-close]").onclick=closeSheet;
  sheet.querySelector('a[href="#panel"]').onclick=closeSheet;
}

/* ---------- panel ---------- */
const ST={nuevo:"Nuevo",prep:"Preparando",listo:"Listo",entregado:"Entregado"};
const NEXT={nuevo:["prep","Empezar a preparar"],prep:["listo","Marcar listo"],listo:["entregado","Entregado"]};
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/60e3));return m<1?"recién":m<60?`hace ${m} min`:`hace ${Math.floor(m/60)} h`}
function renderPanel(){
  const os=S.orders.slice().sort((a,b)=>b.t-a.t);
  const sold=os.reduce((s,o)=>s+o.total,0);
  const c={};os.forEach(o=>o.lines.forEach(l=>c[l.label]=(c[l.label]||0)+l.q));
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("k-total").textContent=clp(sold);
  document.getElementById("k-count").textContent=os.length;
  document.getElementById("k-top").textContent=top?top[0]:"—";
  const ot=document.getElementById("openToggle");ot.setAttribute("aria-pressed",S.open);ot.querySelector("span").textContent=S.open?"Abierto":"Cerrado";
  const tabs=[["activos","En curso"],["nuevo","Nuevos"],["prep","Preparando"],["listo","Listos"],["entregado","Entregados"]];
  const cnt=k=>k==="activos"?os.filter(o=>o.st!=="entregado").length:os.filter(o=>o.st===k).length;
  document.getElementById("ptabs").innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${panelTab===k}">${l} <span class="num">${cnt(k)}</span></button>`).join("");
  const list=os.filter(o=>panelTab==="activos"?o.st!=="entregado":o.st===panelTab);
  document.getElementById("orders").innerHTML=list.length?list.map(orderHTML).join(""):'<div class="empty">No hay pedidos aquí. Haz uno desde «Menú del cliente» y míralo llegar.</div>';
  document.getElementById("stock").innerHTML=Object.values(ITEMS).filter(i=>i.price!==null).map(i=>`<div class="srow"><span>${i.name}</span><button class="toggle" data-stock="${i.id}" aria-pressed="${!S.soldout[i.id]}"><i></i>${S.soldout[i.id]?"Agotado":"Hay"}</button></div>`).join("");
}
function orderHTML(o){
  const nx=NEXT[o.st];const ph=o.phone.replace(/\D/g,"");
  const MSG={prep:`Hola ${o.name}, ya estamos preparando tu pedido #${o.n} en Tengo Hamble. Te avisamos cuando esté listo.`,
             listo:`Hola ${o.name}, tu pedido #${o.n} de Tengo Hamble está listo para retirar. Total ${clp(o.total)}.`};
  const msg=MSG[o.st]?encodeURIComponent(MSG[o.st]):"";
  return `<article class="order s-${o.st}${o.n===freshN?" fresh":""}">
  <div class="c-head"><div><div class="c-num num">#${o.n}</div><div class="c-who">${o.name}${o.ex?'<span class="ex">ejemplo</span>':""}</div></div>
  <div><span class="c-st"><i></i>${ST[o.st]}</span><div class="c-when">${ago(o.t)}</div></div></div>
  <div class="c-pick"><span>Retiro</span><b>${o.pickup}</b></div>
  <ul class="c-lines">${o.lines.map(l=>`<li><span class="q">${l.q}×</span><span>${l.label}${l.det?`<span class="det">${l.det}</span>`:""}</span><span class="pr">${clp(l.q*l.u)}</span></li>`).join("")}${o.promo?`<li class="promo"><span></span><span>Promo sushi</span><span class="pr">−${clp(o.promo)}</span></li>`:""}</ul>
  ${o.note?`<div class="c-note">${o.note}</div>`:""}
  <div class="perf"></div>
  <div class="c-tot"><span>${o.pay}</span><b class="num">${clp(o.total)}</b></div>
  <div class="acts">${nx?`<button class="go" data-adv="${o.n}">${nx[1]}</button>`:""}${msg&&ph.length>=8?`<a class="wa" href="https://wa.me/${ph}?text=${msg}" target="_blank" rel="noopener">${o.st==="prep"?"Avisar: en preparación":"Avisar: está listo"}</a>`:""}</div></article>`;
}
document.getElementById("panelView").addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){panelTab=t.dataset.tab;renderPanel();return}
  const a=e.target.closest("[data-adv]");if(a){const o=S.orders.find(o=>o.n==a.dataset.adv);o.st=NEXT[o.st][0];if(freshN===o.n)freshN=null;save();renderPanel();updateBadge();toast(`#${o.n}: ${ST[o.st]}`);return}
  const s=e.target.closest("[data-stock]");if(s){const id=s.dataset.stock;S.soldout[id]=!S.soldout[id];S.cart=S.cart.filter(l=>!S.soldout[l.id]);save();renderPanel();renderMenu();renderBar();return}
});
document.getElementById("openToggle").onclick=()=>{S.open=!S.open;save();renderPanel();renderMenu();toast(S.open?"El carrito está abierto":"El carrito está cerrado")};
document.getElementById("resetDemo").onclick=()=>{S=seed();sel={};freshN=null;save();renderAll();toast("Demo reiniciada")};
function updateBadge(){const n=S.orders.filter(o=>o.st==="nuevo").length;const b=document.getElementById("nbadge");b.hidden=!n;b.textContent=n}

/* ---------- misc ---------- */
let ac;function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.15,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.15);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.16)})}catch(e){}}
let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800)}
function route(){return location.hash==="#panel"?"panel":"menu"}
function renderAll(){
  const r=route();
  document.getElementById("menuView").hidden=r!=="menu";
  document.getElementById("panelView").hidden=r!=="panel";
  document.getElementById("v-menu").setAttribute("aria-current",r==="menu"?"page":"false");
  document.getElementById("v-panel").setAttribute("aria-current",r==="panel"?"page":"false");
  renderMenu();renderPanel();renderBar();updateBadge();
}
window.addEventListener("hashchange",()=>{renderAll();window.scrollTo(0,0)});
window.addEventListener("storage",e=>{if(e.key===K){const n=load();if(n){const had=S.orders.length;S=n;if(S.orders.length>had){freshN=S.orders[S.orders.length-1].n;beep()}renderAll()}}});
renderAll();
setInterval(()=>{if(route()==="panel")renderPanel()},60e3);
</script>

</body>
</html>
